<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            font-family: Arial, sans-serif;
            color: white;
        }

        .game {
            text-align: center;
            background: #111827;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            margin: 15px;
            font-size: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 8px;
            justify-content: center;
        }

        .cell {
            width: 90px;
            height: 90px;
            background: #374151;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover {
            background: #4b5563;
        }

        #restart {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        #restart:hover {
            background: #1d4ed8;
        }

        @media (max-width: 400px) {
            .board {
                grid-template-columns: repeat(3, 75px);
            }

            .cell {
                width: 75px;
                height: 75px;
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="game">
        <h1>Tic-Tac-Toe</h1>

        <div id="status">Player X's Turn</div>

        <div class="board">
            <button class="cell" onclick="makeMove(0)"></button>
            <button class="cell" onclick="makeMove(1)"></button>
            <button class="cell" onclick="makeMove(2)"></button>

            <button class="cell" onclick="makeMove(3)"></button>
            <button class="cell" onclick="makeMove(4)"></button>
            <button class="cell" onclick="makeMove(5)"></button>

            <button class="cell" onclick="makeMove(6)"></button>
            <button class="cell" onclick="makeMove(7)"></button>
            <button class="cell" onclick="makeMove(8)"></button>
        </div>

        <button id="restart" onclick="restartGame()">Restart Game</button>
    </div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameOver = false;

        const cells = document.querySelectorAll(".cell");
        const status = document.getElementById("status");

        const winningPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function makeMove(index) {
            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = currentPlayer;
            cells[index].textContent = currentPlayer;

            checkWinner();
        }

        function checkWinner() {
            for (let pattern of winningPatterns) {
                let a = pattern[0];
                let b = pattern[1];
                let c = pattern[2];

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {
                    status.textContent =
                        "Player " + currentPlayer + " Wins! 🎉";
                    gameOver = true;
                    return;
                }
            }

            if (!board.includes("")) {
                status.textContent = "Game Draw! 🤝";
                gameOver = true;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            status.textContent = "Player " + currentPlayer + "'s Turn";
        }

        function restartGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameOver = false;

            cells.forEach(function(cell) {
                cell.textContent = "";
            });

            status.textContent = "Player X's Turn";
        }
    </script>

</body>
</html>
